name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On-demand runs. Added 2026-08-11 while diagnosing why push events
  # (recorded by GitHub — the events API shows every push) have never
  # created a single run of this workflow: dispatch gives the oracle a
  # manual trigger and gives the diagnosis a run object to read.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension build + virgin smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Drift gate: the Dockerfile's SQL COPY block is GENERATED from the
      # extension_sql_file! calls in src/lib.rs. A chain file added to lib.rs
      # without regenerating the block would be a builder compile error —
      # catch it here with a named failure instead of a cryptic build log.
      - name: Check generated SQL COPY manifest
        run: bash extension/gen-copy-manifest.sh --check

      - name: Build the extension image
        run: docker build -t stewards-oss-pg:ci extension/

      # NO shared_preload_libraries, deliberately. _PG_init returns early
      # unless it is being preloaded, so this cluster registers ZERO
      # dispatcher bgworkers — and the virgin smoke is one psql session
      # asserting thousands of things about substrate state, which is only
      # sound if nothing else is writing to it. The dispatcher ticks every
      # 500ms and, on a lifeless install, enqueues a pending
      # model-unconfigured hinge bell; OK 30 asserts the queue is empty. That
      # race decided whether the RELEASE GATE passed, and it was observed
      # both ways on the same image minutes apart.
      #
      # The suite asserts this environment itself (OK 0) rather than trusting
      # the workflow to keep providing it. Bgworker behaviour is not dropped —
      # it moves to its own job below, where a concurrent writer is the point.
      - name: Start a virgin Postgres (bgworker ISOLATED — see OK 0)
        run: |
          docker run -d --name pg \
            -e POSTGRES_USER=stewards \
            -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=stewards \
            stewards-oss-pg:ci

      - name: Wait for readiness
        run: |
          ok=
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -U stewards -d stewards >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::Postgres did not become ready"; docker logs pg; exit 1; fi

      # The v49 preflight must REFUSE a cluster with no operator roles, with
      # the remediation in the message — the red path of the sol-p0 batch
      # (pre-v51, this was a bare "role does not exist" 55k lines into the
      # extension script). The failed CREATE EXTENSION is atomic, so the
      # cluster stays virgin for the green run below.
      - name: Preflight refuses without the operator roles (red path)
        run: |
          set +e
          out=$(docker exec -i pg psql -U stewards -d stewards -v ON_ERROR_STOP=1 \
                -c "CREATE EXTENSION pg_ai_stewards CASCADE;" 2>&1)
          rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::CREATE EXTENSION succeeded on a cluster with no operator roles"
            exit 1
          fi
          if ! echo "$out" | grep -q "operator-provisioned group roles"; then
            echo "::error::preflight refusal fired without its remediation message"
            exit 1
          fi

      # The operator bootstrap fixture — the same file compose runs on first
      # boot and the docs point manual installs at. CI exercising the real
      # fixture, not a parallel test-only one, is deliberate.
      - name: Provision the operator roles (bootstrap fixture)
        run: docker exec -i pg psql -U stewards -d stewards -v ON_ERROR_STOP=1 < extension/init/00-bootstrap-roles.sql

      - name: Run the virgin-boot smoke (CREATE EXTENSION + clean-room asserts)
        run: docker exec -i pg psql -U stewards -d stewards -v ON_ERROR_STOP=1 < tests/virgin-smoke.sql

      # Two-session write races (concurrent add, concurrent amend). Runs
      # AFTER the smoke: it installs dblink, which the smoke's OK 1
      # dependency-surface assert must never see.
      - name: Concurrency regression (two-session add + amend)
        run: docker exec -i pg psql -U stewards -d stewards -v ON_ERROR_STOP=1 < tests/concurrency-write-path.sql

      # The hazard OK 0 exists to exclude, reproduced ON DEMAND rather than
      # waited for: one hand-made watchman tick (the exact call bgworker.rs:414
      # makes) rings the bell and flips should_run false -> true, which is what
      # OK 30 asserts against.
      #
      # Its OWN clean container, not the one the smoke just ran on: the pin
      # opens by requiring a genuinely virgin queue, and a post-smoke database
      # is not one. Reusing `pg` would make it fail for a reason that has
      # nothing to do with the race it is pinning.
      - name: OK 30 race pin (the flake, on demand)
        run: |
          docker run -d --name pin \
            -e POSTGRES_USER=stewards -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=stewards \
            stewards-oss-pg:ci
          ok=
          for i in $(seq 1 60); do
            if docker exec pin pg_isready -U stewards -d stewards >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::pin Postgres did not become ready"; docker logs pin; exit 1; fi
          docker exec -i pin psql -U stewards -d stewards -v ON_ERROR_STOP=1 < extension/init/00-bootstrap-roles.sql
          docker exec -i pin psql -U stewards -d stewards -v ON_ERROR_STOP=1 < tests/ok30-race-pin.sql

      - name: Teardown
        if: always()
        run: docker rm -f pg pin || true

  bgworker:
    name: bgworker integration (preloaded — a writer is the point)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build the extension image
        run: docker build -t stewards-oss-pg:ci extension/

      # WITH shared_preload_libraries — the opposite of the smoke job, on
      # purpose. Isolating the bgworker made the smoke deterministic; it must
      # not also make the bgworker untested.
      - name: Start Postgres WITH the dispatcher preloaded
        run: |
          docker run -d --name bg \
            -e POSTGRES_USER=stewards \
            -e POSTGRES_PASSWORD=ci \
            -e POSTGRES_DB=stewards \
            stewards-oss-pg:ci \
            -c shared_preload_libraries=pg_ai_stewards

      - name: Wait for readiness
        run: |
          ok=
          for i in $(seq 1 60); do
            if docker exec bg pg_isready -U stewards -d stewards >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::Postgres did not become ready"; docker logs bg; exit 1; fi

      - name: Provision the operator roles (bootstrap fixture)
        run: docker exec -i bg psql -U stewards -d stewards -v ON_ERROR_STOP=1 < extension/init/00-bootstrap-roles.sql

      # Asserts the dispatcher is actually there before testing it (a vacuous
      # pass is the failure mode this phase exists to avoid), that the lifeless
      # degrade rings its deduped bell UNPROMPTED, and the inverse: a
      # configured watchman must stay silent.
      - name: Dispatcher behaviour (positive AND inverse)
        run: docker exec -i bg psql -U stewards -d stewards -v ON_ERROR_STOP=1 < tests/bgworker-integration.sql

      - name: Teardown
        if: always()
        run: docker rm -f bg || true

  go:
    name: go build + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
